<!doctype html>
<meta charset="utf-8">
<title>Landmark dump (debug)</title>
<body>
<p>Debug page: dumps MediaPipe landmarks for a photo. Use <code>await window.dump({photo, version, delegate, input})</code> from the console.
input is img, canvas, imagedata or bitmap. version defaults to the one in config.js.</p>
<script type="module">
import { MP_VERSION, MODEL_URL } from '../js/config.js';

const cache = {};
async function lib(version) {
  const base = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${version}`;
  cache[version] ??= (async () => {
    const mp = await import(`${base}/vision_bundle.mjs`);
    const fileset = await mp.FilesetResolver.forVisionTasks(`${base}/wasm`);
    return { mp, fileset };
  })();
  return cache[version];
}
let modelBytes;
async function model() { modelBytes ??= new Uint8Array(await (await fetch(MODEL_URL)).arrayBuffer()); return modelBytes; }

window.dump = async ({ photo = 'perBoy', version = MP_VERSION, delegate = 'CPU', input = 'img', mode = 'IMAGE' } = {}) => {
  const { mp, fileset } = await lib(version);
  const lm = await mp.FaceLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetBuffer: (await model()).slice(), delegate },
    runningMode: mode, numFaces: 3, outputFacialTransformationMatrixes: true, outputFaceBlendshapes: true,
  });
  const img = new Image();
  img.src = `../../${photo}.jpg`;
  await img.decode();
  const w = img.naturalWidth, h = img.naturalHeight;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, 0, 0, w, h);
  let source = img;
  if (input === 'canvas') source = c;
  else if (input === 'imagedata') source = g.getImageData(0, 0, w, h);
  else if (input === 'bitmap') source = await createImageBitmap(img);
  const r = mode === 'VIDEO' ? lm.detectForVideo(source, 1) : lm.detect(source);
  const f = r.faceLandmarks[0];
  const d = r.facialTransformationMatrixes?.[0]?.data;
  const matrix = d ? [0, 1, 2, 3].map((row) => [0, 1, 2, 3].map((col) => d[col * 4 + row])) : null;
  const out = { w, h, version, delegate, input, matrix, pts: f.map((p) => [p.x * w - 0.5, p.y * h - 0.5, p.z * w]),
    blendshapes: r.faceBlendshapes?.[0] ? Object.fromEntries(r.faceBlendshapes[0].categories.map((c) => [c.categoryName, c.score])) : null, imageData: g.getImageData(0, 0, w, h) };
  lm.close();
  return out;
};

// Rates a photo against the ideal with the website's scoring on the landmarks of the chosen delegate
import * as scoring from '../js/scoring.js';
window.rate = async (opts, reference) => {
  const b = await window.dump(opts);
  const r = scoring.rateFace(b.imageData, b.pts, b.matrix, reference, 'file', b.blendshapes);
  return { score: +r.score.toFixed(3), symmetry: +r.symmetry.toFixed(4), clarity: r.clarity };
};
window.ready = true;
</script>
